name: Refresh SEC data

on:
  schedule:
    - cron: '17 5 * * *'     # every day at 05:17 UTC
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Yahoo Finance library
        run: npm install --no-save yahoo-finance2@4.0.5
      - name: Pull SEC data
        run: node fetch_sec.js
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          TICKERS_CSV_URL: ${{ secrets.TICKERS_CSV_URL }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
      - name: Save data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh SEC data"
          git push
