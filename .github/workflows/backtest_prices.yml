name: Back-test price history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save yahoo-finance2@4.0.5
      - run: node backtest/fetch_prices.js
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest
          git diff --cached --quiet || git commit -m "Back-test price history"
          git pull --rebase && git push
